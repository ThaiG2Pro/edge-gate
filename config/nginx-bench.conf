# Phase 9 G8 (D8/D9): nginx làm reverse proxy cùng việc với EdgeGate —
# keep-alive hai phía, pool 64 tới upstream, không log, không cache, không gzip.
# Chạy: docker run --network host --cpuset-cpus 0-1 -v $PWD/config/nginx-bench.conf:/etc/nginx/nginx.conf:ro nginx:1.25-alpine
worker_processes 2;
worker_rlimit_nofile 65536;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    access_log off;
    keepalive_requests 1000000;
    keepalive_timeout 60s;

    upstream backend {
        server 127.0.0.1:18100;
        keepalive 64;
    }

    server {
        listen 127.0.0.1:18090 reuseport;
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering on;
        }
    }
}
